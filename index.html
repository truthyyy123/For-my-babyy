<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yes or No?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f0f8ff;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 40px;
      font-size: 1.5em;
      text-align: center;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      position: absolute;
      border-radius: 8px;
      border: none;
      color: white;
    }
    #yes {
      left: 40%;
      top: 50%;
      background: #28a745;
    }
    #no {
      left: 55%;
      top: 50%;
      background: #dc3545;
    }
    /* Popup modal */
    .popup {
      display: none; /* hidden by default */
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .popup-content {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 80%;
      animation: fadeIn 0.4s ease;
    }
    .popup-content h2 {
      margin: 0 0 20px;
    }
    .popup-content button {
      background: #0078d7;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>
  <h1>Love mo ba talaga ako babyy?</h1>
  <button id="yes">Yes</button>
  <button id="no">No</button>

  <!-- Popup -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>heheheh dapat lang dejk lang baby ko I love you so much my babyyyy always MWAHHH! 💖</h2>
      <button id="closePopup">Close</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const popup = document.getElementById('popup');
    const closePopup = document.getElementById('closePopup');

    function moveNoButton() {
      const x = Math.floor(Math.random() * (window.innerWidth - noBtn.offsetWidth));
      const y = Math.floor(Math.random() * (window.innerHeight - noBtn.offsetHeight));
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton); // mobile

    yesBtn.addEventListener('click', () => {
      popup.style.display = 'flex'; // show popup
    });

    closePopup.addEventListener('click', () => {
      popup.style.display = 'none'; // hide popup
    });
  </script>
</body>
</html>
